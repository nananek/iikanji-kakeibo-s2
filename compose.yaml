# ローカルで動かす:
#   docker compose up --build
# ブラウザで http://localhost:8080 を開く (アカウント作成 → 認証アプリに TOTP 登録 → ログイン)。
#
# GHCR の公開イメージを使う場合は app.build を消して app.image を有効化する。
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iikanji
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    # image: ghcr.io/nananek/iikanji-kakeibo-s2:main
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/iikanji
      # 本番では必ず固有のランダム値に変更すること (例: openssl rand -hex 32)。
      SERVER_SECRET: change-me-please-use-a-random-secret
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: info
    ports:
      - "8080:8080"

volumes:
  pgdata:
