[package]
name = "iikanji-domain"
version = "0.1.0"
description = "純会計ロジック (複式簿記・StandardChart・試算表)。no_std+alloc, I/O 無し。client/server で共有。"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# 純ロジック本体は外部依存ゼロ (core + alloc)。
# `serde` feature 有効時のみ records (CBOR) コーデックを含む。
serde = { workspace = true, optional = true, default-features = false, features = ["alloc", "derive"] }
ciborium = { workspace = true, optional = true }

[features]
# レコード平文 DTO の serde + CBOR 版管理コーデック。client/server 連携で有効化。
serde = ["dep:serde", "dep:ciborium"]
