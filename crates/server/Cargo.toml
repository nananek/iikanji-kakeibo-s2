[package]
name = "iikanji-server"
version = "0.1.0"
description = "認証付き暗号 blob ストア (Axum + Postgres)。レコードは決して復号しない。"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "iikanji_server"
path = "src/lib.rs"

[[bin]]
name = "iikanji-server"
path = "src/main.rs"

[dependencies]
iikanji-crypto = { path = "../crypto" }
iikanji-types = { path = "../types" }
axum = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
zeroize = { workspace = true }
tower-http = { workspace = true, features = ["set-header"] }
sha2 = { workspace = true }
base64 = { workspace = true }
# WebAuthn (passkey 第2要素)。danger-allow-state-serialisation は ceremony 途中状態
# (PasskeyRegistration/PasskeyAuthentication) を DB に serde 永続化するために必須。
webauthn-rs = { workspace = true, features = ["danger-allow-state-serialisation"] }
# 添付バイナリのストレージ (S3 互換 / テストは InMemory)。
object_store = { workspace = true }
# object_store の list ストリーム反復 (添付 GC) 用の StreamExt。
futures = { version = "0.3", default-features = false, features = ["std"] }
# webauthn-rs-core が引き込む openssl を vendored (静的リンク) で固める。これにより builder/runtime/CI で
# libssl-dev / libssl3 / pkg-config に依存せず self-contained にビルドできる (reproducible build 方針)。
# server コード自体は openssl を直接使わない — vendored feature を有効化するためだけの依存。
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
base64 = { workspace = true }
