[workspace]
resolver = "2"
members = ["crates/crypto", "crates/domain", "crates/types", "crates/server", "crates/client"]

[workspace.package]
edition = "2021"
license = "LicenseRef-SUL-1.0"
repository = "https://github.com/nananek/iikanji-kakeibo-s2"

# 共有依存バージョン。crate 側は `dep = { workspace = true }` で参照する。
# 暗号は RustCrypto に統一 (libsodium/dryoc 不採用 — CLAUDE.md 参照)。
[workspace.dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
getrandom = "0.2"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
totp-rs = { version = "5", features = ["otpauth"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = { version = "0.2", default-features = false }
base64 = "0.22"
uuid = { version = "1", features = ["serde", "v4"] }
# server
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
    "macros",
] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
http-body-util = "0.1"
# client (Leptos CSR → WASM)。client crate のみが wasm32 で参照する。
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1"
# WebAuthn (passkey 第2要素)。server は native で webauthn-rs を、client は wasm32 で
# webauthn-rs-proto(wasm) + web-sys を参照する。passkey は鍵ツリー外でセッションを gate
# するだけで復号鍵ではない (CLAUDE.md invariant 3)。
# wasm-bindgen は CI 固定の wasm-bindgen-cli@0.2.122 と一致させる (bump 時は ci.yml も更新)。
webauthn-rs = "0.5"
webauthn-rs-proto = "0.5"
web-sys = "0.3"
js-sys = "0.3"
wasm-bindgen = "0.2.122"
wasm-bindgen-futures = "0.4"
