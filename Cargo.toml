[workspace]
resolver = "2"
members = ["crates/crypto"]

[workspace.package]
edition = "2021"
license = "LicenseRef-SUL-1.0"
repository = "https://github.com/nananek/iikanji-kakeibo-s2"

# 共有依存バージョン。crate 側は `dep = { workspace = true }` で参照する。
# 暗号は RustCrypto に統一 (libsodium/dryoc 不採用 — CLAUDE.md 参照)。
[workspace.dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
getrandom = "0.2"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
thiserror = "2"
