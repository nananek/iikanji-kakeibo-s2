name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # サーバー / コア (Rust native): fmt + clippy + test + カバレッジ。Postgres を起動して統合テスト。
  server:
    name: server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iikanji_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/iikanji_test
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Test + coverage
        run: |
          cargo llvm-cov --no-report --workspace --all-features
          cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex 'src/main\.rs'
          cargo llvm-cov report --summary-only --fail-under-lines 70 --ignore-filename-regex 'src/main\.rs'
      - name: Upload coverage (lcov)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error

  # フロント (WASM): クライアント実装まで、E2EE コア crate が wasm32 を壊さないことを担保する。
  # Leptos client 追加後は trunk build / wasm-pack に拡張する。
  front:
    name: front
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build wasm-targeted crates
        run: cargo build --target wasm32-unknown-unknown -p iikanji-crypto -p iikanji-domain -p iikanji-types -p iikanji-client
      - name: Build domain (serde/records) for wasm
        run: cargo build --target wasm32-unknown-unknown -p iikanji-domain --features serde

  # E2E: SPA を Trunk でビルド→静的配信し、実 Axum+Postgres サーバーへプロキシして
  # Playwright (Firefox) で E2EE ceremony を実ブラウザ検証する。
  # tests/e2e/*.spec.* が無い間は scaffold (green) のまま。
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iikanji_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # playwright.config.ts の server webServer が読む。Postgres service へ接続。
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/iikanji_test
    steps:
      - uses: actions/checkout@v5
      - name: Detect E2E specs
        id: detect
        run: |
          if ls tests/e2e/*.spec.* >/dev/null 2>&1; then
            echo "have_specs=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_specs=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust (wasm32)
        if: steps.detect.outputs.have_specs == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: steps.detect.outputs.have_specs == 'true'
      - name: Install Trunk
        if: steps.detect.outputs.have_specs == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Build SPA (trunk --release)
        if: steps.detect.outputs.have_specs == 'true'
        run: trunk build --release
      - name: Build API server
        if: steps.detect.outputs.have_specs == 'true'
        run: cargo build -p iikanji-server
      - name: Setup Node
        if: steps.detect.outputs.have_specs == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run Playwright E2E
        if: steps.detect.outputs.have_specs == 'true'
        # playwright.config.ts の webServer が Rust サーバー + 静的/プロキシサーバーを起動する。
        run: |
          npm ci --include=dev
          npx playwright install --with-deps firefox
          npx playwright test
      - name: Upload Playwright report
        if: ${{ !cancelled() && steps.detect.outputs.have_specs == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: No E2E specs yet (scaffold)
        if: steps.detect.outputs.have_specs != 'true'
        run: echo "E2E スペック未追加 (scaffold)。tests/e2e/*.spec.* 追加で Playwright を有効化する。"
