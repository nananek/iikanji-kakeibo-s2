name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # サーバー / コア (Rust native): fmt + clippy + test + カバレッジ。
  server:
    name: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Test + coverage
        run: |
          cargo llvm-cov --no-report --workspace --all-features
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only --fail-under-lines 70
      - name: Upload coverage (lcov)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error

  # フロント (WASM): クライアント実装まで、E2EE コア crate が wasm32 を壊さないことを担保する。
  # Leptos client 追加後は trunk build / wasm-pack に拡張する。
  front:
    name: front
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build wasm-targeted crates
        run: cargo build --target wasm32-unknown-unknown -p iikanji-crypto

  # E2E: Leptos client 実装までは scaffold (spec が無ければ green で通す)。
  # tests/e2e/*.spec.* が追加された時点で Playwright を自動実行する。
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Detect E2E specs
        id: detect
        run: |
          if ls tests/e2e/*.spec.* >/dev/null 2>&1; then
            echo "have_specs=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_specs=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Node
        if: steps.detect.outputs.have_specs == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Playwright E2E
        if: steps.detect.outputs.have_specs == 'true'
        run: |
          npm ci
          npx playwright install --with-deps firefox
          npx playwright test
      - name: No E2E specs yet (scaffold)
        if: steps.detect.outputs.have_specs != 'true'
        run: echo "E2E スペック未追加 (Leptos client 実装まで scaffold)。client 追加時に Playwright を有効化する。"
